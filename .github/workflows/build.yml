name: Build STARPLAYER

# Manual only — run from the "Actions" tab on GitHub ("Run workflow") whenever
# you want fresh Windows/macOS/Linux builds. Doesn't run on every push, since
# a full 3-platform build is slow and there's no need to do it per-commit.
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary — one build that runs on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # webkit2gtk etc. — Tauri's Linux GUI dependencies, not needed on Windows/macOS.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build STARPLAYER
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: starplayer-v__VERSION__
          releaseName: 'STARPLAYER v__VERSION__'
          releaseBody: 'Build automático de STARPLAYER. Descarga el instalador para tu sistema operativo. No está firmado digitalmente, así que Windows/macOS pueden mostrar una advertencia la primera vez que lo abras — es normal, solo confirma que quieres ejecutarlo.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
